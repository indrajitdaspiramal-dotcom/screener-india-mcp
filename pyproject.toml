[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "screener-india-mcp"
version = "0.1.2"
description = "Screener India MCP — the rate-safe, source-traced Screener.in server for AI assistants (Indian NSE/BSE fundamentals)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Indrajit Das" }]
requires-python = ">=3.10"
keywords = ["mcp", "screener", "screener.in", "nse", "bse", "india", "stocks", "fundamentals", "claude", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "mcp>=1.10,<2",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "keyring>=24",
  "filelock>=3.13",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
screener-india-mcp = "screener_india_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/indrajitdaspiramal-dotcom/screener-india-mcp"
Issues = "https://github.com/indrajitdaspiramal-dotcom/screener-india-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/screener_india_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
